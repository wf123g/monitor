spring.application.name=monitor

# Override MONITOR_DB_URL if MySQL is not running locally on port 3306.
spring.datasource.url=${MONITOR_DB_URL:jdbc:mysql://localhost:3306/monitor}
spring.datasource.username=${MONITOR_DB_USERNAME}
spring.datasource.password=${MONITOR_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Map columns such as read_row_number to Java fields such as readRowNumber.
mybatis.configuration.map-underscore-to-camel-case=true
